name: Android Build (MVP - No Rust)

on:
  push:
    branches: [mvp-sem-rust]
  pull_request:
    branches: [mvp-sem-rust]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # Download commandline-tools
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          # The zip extracts to a folder named "cmdline-tools" containing "bin/"
          # We need $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/latest
          # The zip contents are: cmdline-tools/bin/, cmdline-tools/lib/
          # So we need to move cmdline-tools/cmdline-tools/* to cmdline-tools/latest/
          if [ -d "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools"/* "$HOME/android-sdk/cmdline-tools/latest/"
            rmdir "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools" 2>/dev/null || true
          fi
          # Set environment variables
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          # Use absolute path to sdkmanager
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Accept licenses using absolute path
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Install required packages using absolute path
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
