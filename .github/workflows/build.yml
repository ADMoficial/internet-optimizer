name: Android Build (MVP - No Rust)

on:
  push:
    branches: [mvp-sem-rust]
  pull_request:
    branches: [mvp-sem-rust]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # Download and install commandline-tools
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/cmdline-tools
          mv cmdline-tools/cmdline-tools/* cmdline-tools/cmdline-tools/ 2>/dev/null || true
          # OR: the zip extracts to cmdline-tools/bin/, so we restructure
          # Actually the zip extracts to a single directory, let's handle it properly
          rm -rf cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/latest
          # Set environment variables
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Accept licenses
          yes | sdkmanager --licenses || true
          # Install required packages as separate commands
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
