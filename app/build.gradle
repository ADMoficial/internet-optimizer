plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.internetoptimizer'
    compileSdk 35

    defaultConfig {
        applicationId "com.internetoptimizer"
        minSdk 24      // Android 7.0 — VpnService is stable
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.7.3"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.activity:activity-compose:1.11.0'

    // Jetpack Compose + Material 3
    implementation 'androidx.compose.ui:ui:1.7.0'
    implementation 'androidx.compose.ui:ui-toolting-preview:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.1'

    // Compose lifecycle integration
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson — for config serialization
    implementation 'com.google.code.gson:gson:2.11.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Compose testing
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.0'
}
